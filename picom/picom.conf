# Catppuccin-friendly compositor settings for Qtile and Kitty.
backend = "glx";
vsync = true;
use-damage = true;

# Soft edges and restrained shadows give tiled windows visual separation.
corner-radius = 10;
detect-rounded-corners = true;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;

# Keep Kitty readable while gently softening the wallpaper beneath it.
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-frame = true;

# Short transitions without making the desktop feel sluggish.
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;

frame-opacity = 1.0;
detect-client-opacity = true;
detect-transient = true;

rules: ({
  match = "window_type = 'dock' || window_type = 'desktop'";
  shadow = false;
  blur-background = false;
  corner-radius = 0;
}, {
  # Keep Slop's selection overlay out of screenshots.
  match = "class_g = 'slop'";
  fade = false;
  blur-background = false;
  shadow = false;
  corner-radius = 0;
}, {
  match = "window_type = 'tooltip'";
  opacity = 0.95;
  full-shadow = false;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
})
