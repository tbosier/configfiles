# Typography and spacing
font_family MesloLGS Nerd Font
font_size 12.0
disable_ligatures never
window_padding_width 10

# Window appearance
background_opacity 0.93
dynamic_background_opacity yes
confirm_os_window_close 0

# Cursor and bell
cursor_shape beam
cursor_beam_thickness 1.5
enable_audio_bell no
visual_bell_duration 0.08

# Tabs stay out of the way until they are useful
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style fade
tab_fade 1 1 3 5
tab_title_template " {index}: {title} "
active_tab_font_style bold
inactive_tab_font_style normal
active_tab_foreground #1e1e2e
active_tab_background #89b4fa
inactive_tab_foreground #a6adc8
inactive_tab_background #313244

# Catppuccin Mocha
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc
cursor #f5e0dc
cursor_text_color #1e1e2e
url_color #89b4fa

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# Quality of life
copy_on_select yes
strip_trailing_spaces smart
detect_urls yes
open_url_with default
scrollback_lines 100000

# Rendering
repaint_delay 7
input_delay 0
sync_to_monitor yes
